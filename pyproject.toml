[project]
name = "photonics-helper"
version = "0.1.9"
description = "A comprehensive helper library for photonics and optics calculations"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [
    {name = "Hitaishi V", email = "hitaishi2222@gmail.com"}
]
keywords = ["photonics", "optics", "wavelength", "frequency", "conversion"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "matplotlib>=3.10.3",
    "numpy>=2.2.6",
    "pydantic>=2.12.5",
    "rich>=14.3.3",
    "scipy>=1.15.3",
]

[project.optional-dependencies]
plotting = ["plotly>=5.0"]
webapp = ["dash>=2.18.0"]
examples = ["tqdm>=4.66"]
extras = ["imageio>=2.33"]
# FFTW3 backend for the GNLSE / Raman FFTs (pyfftw ships cp311–cp313 wheels;
# the solver falls back to numpy.fft automatically when this is absent)
fftw = ["pyfftw>=0.15.1"]
# Eigenmode solvers used by examples/generate_waveguide_mode_data.py to produce
# real n_eff(λ) exports (femwell = FEM, tidy3d = local mode solver).
mode-export = ["femwell>=0.1.12", "tidy3d>=2.12"]
# API documentation (zensical + mkdocstrings; zensical reads mkdocs.yml)
# built by .github/workflows/docs.yml.
docs = ["zensical>=0.0.60", "mkdocstrings[python]>=0.26"]
# CI tooling (ruff + mypy gates and the test suite) — used by .github/workflows/ci.yml
dev = ["pytest>=8.0", "ruff>=0.8", "mypy>=1.13", "hypothesis>=6.0", "pyyaml>=6.0"]
all = ["plotly>=5.0", "dash>=2.18.0", "tqdm>=4.66", "pyfftw>=0.15.1", "imageio>=2.33"]

[build-system]
# setuptools>=77 is required for PEP 639 SPDX license expressions and
# `license-files` in [project].
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"


[project.urls]
Homepage = "https://github.com/hitaishi2222/photonics_helper"
Documentation = "https://hitaishi2222.github.io/photonics_helper/"

[tool.setuptools.packages.find]
# Flat layout: only the library package ships (not reproductions/, examples/, etc.).
include = ["photonics_helper*"]

[tool.setuptools.package-data]
photonics_helper = ["py.typed", "materials.db"]

# Pin the rule set explicitly so lint results stay stable across ruff releases
# (ruff 0.16 expanded the default select; we keep the classic default set).
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# sys.path bootstrap scripts intentionally import after the path hack
"benchmarks/*" = ["E402"]
"examples/*" = ["E402"]
# `l` is the standard Laguerre–Gaussian azimuthal index in physics notation
"photonics_helper/structured.py" = ["E741"]
"examples/28_structured_light.py" = ["E741"]
"tests/test_structured.py" = ["E741"]
"tests/test_breathers.py" = ["E731"]
"tests/test_dashboard.py" = ["E402"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
permissive-ignores = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
ignore_missing_imports = true
strict_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["photonics_helper"]
omit = ["tests/*", "examples/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
]

[tool.dependency-groups]
dev = [
    "pytest>=9.0.2",
    "mypy>=1.15.0",
    "ruff>=0.11.0",
    "pre-commit>=3.8.0",
    "coverage>=7.0",
    "tqdm>=4.66",
    "hypothesis>=6.0",
    "pyyaml>=6.0",
]

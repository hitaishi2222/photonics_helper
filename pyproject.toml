[project]
name = "photonics-helper"
version = "0.1.0"
description = "A comprehensive helper library for photonics and optics calculations"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Hitaishi V", email = "hitaishi2222@gmail.com"}
]
keywords = ["photonics", "optics", "wavelength", "frequency", "conversion"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "matplotlib>=3.10.3",
    "numpy>=2.2.6",
    "pydantic>=2.12.5",
    "rich>=14.3.3",
    "scipy>=1.15.3",
]

[project.optional-dependencies]
plotting = ["plotly>=5.0"]
webapp = ["dash>=2.18.0"]
examples = ["tqdm>=4.66"]
# FFTW3 backend for the GNLSE / Raman FFTs (pyfftw ships cp311–cp313 wheels;
# the solver falls back to numpy.fft automatically when this is absent)
fftw = ["pyfftw>=0.15.1"]
all = ["plotly>=5.0", "dash>=2.18.0", "tqdm>=4.66", "pyfftw>=0.15.1"]

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"


[project.urls]
Homepage = "https://github.com/hitaishi2222/photonics-helper"
Documentation = "https://github.com/hitaishi2222/photonics-helper#readme"

[tool.setuptools.package-data]
photonics_helper = ["*.pyi"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
permissive-ignores = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
ignore_missing_imports = true
strict_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["photonics_helper"]
omit = ["tests/*", "examples/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
]

[tool.dependency-groups]
dev = [
    "pytest>=9.0.2",
    "mypy>=1.15.0",
    "ruff>=0.11.0",
    "pre-commit>=3.8.0",
    "coverage>=7.0",
    "tqdm>=4.66",
]

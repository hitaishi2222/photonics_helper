name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python-version }} · ${{ matrix.pyfftw }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        pyfftw: ["with-pyfftw", "without-pyfftw"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + tooling
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.pyfftw }}" = "with-pyfftw" ]; then
            python -m pip install -e ".[dev,plotting,webapp,examples,fftw]"
          else
            python -m pip install -e ".[dev,plotting,webapp,examples]"
          fi

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy photonics_helper

      - name: Test (pytest)
        run: pytest -q

      - name: Build package
        run: |
          python -m pip install build
          python -m build

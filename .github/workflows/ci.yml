name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python-version }} · ${{ matrix.pyfftw }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        pyfftw: ["with-pyfftw", "without-pyfftw"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + tooling
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.pyfftw }}" = "with-pyfftw" ]; then
            python -m pip install -e ".[dev,plotting,webapp,examples,fftw]"
          else
            python -m pip install -e ".[dev,plotting,webapp,examples]"
          fi

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy photonics_helper

      - name: Test (pytest)
        run: pytest -q

  packaging:
    name: wheel smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Verify wheel contents
        run: python scripts/check_wheel.py

      - name: Install the wheel into a clean venv and smoke-test
        run: |
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/python -m pip install --upgrade pip
          /tmp/wheeltest/bin/python -m pip install dist/*.whl
          /tmp/wheeltest/bin/python -c "
          from photonics_helper import Wavelength
          from photonics_helper.base import Permeability
          thz = Wavelength(1550, 'nm').to_freq().as_THz
          assert abs(thz - 193.414) < 0.1, thz
          assert float(Permeability.from_relative(1.0)) > 0
          print('wheel smoke OK')
          "

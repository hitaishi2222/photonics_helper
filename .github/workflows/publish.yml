name: Publish to PyPI

# Trusted Publishing (OIDC) — no API token secret required. Configure the
# publisher once on PyPI: project "photonics-helper", owner "hitaishi2222",
# repo "photonics_helper", workflow "publish.yml", environment "pypi".
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Check metadata
        run: twine check dist/*

      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          text = pathlib.Path("pyproject.toml").read_text()
          version = re.search(r'^version = "([^"]+)"', text, re.M).group(1)
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          if tag != version:
              raise SystemExit(
                  f"tag {os.environ['GITHUB_REF_NAME']} does not match "
                  f"pyproject version {version}"
              )
          print(f"tag {tag} matches package version {version}")
          PY

      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  quality:
    name: Quality gate (ruff, mypy, pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,plotting,webapp,examples]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy photonics_helper

      - name: Test (pytest)
        run: pytest -q

  publish:
    name: Publish (Trusted Publishing)
    needs: [build, quality]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/photonics-helper
    permissions:
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

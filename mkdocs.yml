site_name: photonics-helper
site_description: Photonics, fiber optics and nonlinear-optics helpers for Python
site_url: https://hitaishi2222.github.io/photonics_helper/
repo_url: https://github.com/hitaishi2222/photonics_helper
repo_name: hitaishi2222/photonics_helper
edit_uri: edit/main/docs/

theme:
  name: material
  variant: classic            # Zensical: pick 'modern' for the new look
  logo: img/icon.png
  favicon: img/icon.png
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_if_no_docstring: true
            show_source: false
            show_root_heading: true
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
nav:
  - Home: index.md

  - Tutorials:

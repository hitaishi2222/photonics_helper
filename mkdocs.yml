      - Add a material: how-to/add-a-material.md
      - Import a mode from a solver: how-to/import-a-mode.md
      - Reproduce a paper: how-to/reproduce-a-paper.md
      - Read a spectrum: how-to/read-a-spectrum.md
      - Choose a solver: choose-a-solver.md
      - Recipes: recipes.md

  - Reference:
